<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>PedaFlotta niveau 2</title>
<meta name="description" content="PedaFlotta niveau 2 : remontée assistée d'un plongeur">
<meta name="theme-color" content="#00008B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #params { display: none; position: fixed; inset: 0; background: rgba(128,128,128,0.97); z-index: 10;
    flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    font: bold 20px 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; touch-action: auto; }
  #champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 40px; width: min(900px, 92vw); }
  #champs label { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #champs input { -webkit-user-select: text; user-select: text; width: 110px; font: inherit; padding: 6px; border: 1px solid #ABADB3; }
  #valider { font: inherit; font-size: 24px; padding: 14px 60px; border: 1px solid #707070; border-radius: 6px;
    background: linear-gradient(#F3F3F3, #DDD 50%, #CDCDCD); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="params"><div id="champs"></div><button id="valider">Valider</button></div>
<script src="model.js"></script>
<script src="niveau2.js"></script>
</body>
</html>
